<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog preview card</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <article class="card">
            <img class="card__image" src="images/illustration-article.svg" alt="Abstract black and white shapes on a yellow background">

            <div class="card__content">
                <p class="card__category">Learning</p>
                <p class="card__date">Published 21 Dec 2023</p>

                <h1 class="card__title">
                    <a href="#">HTML &amp; CSS foundations</a>
                </h1>
                <p class="card__description">
                    These languages are the backbone of every website. Defining structure, content, and presentation.
                </p>

                <div class="author">
                    <img class="author__avatar" src="images/image-avatar.webp" alt="">
                    <p class="author__name">Greg Hooper</p>
                </div>
            </div>
        </article>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">Azzurmawiy</a>.
    </footer>
</body>
</html>
